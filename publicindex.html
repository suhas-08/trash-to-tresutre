<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trash to Treasure - Smart Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col items-center p-4 sm:p-8">
  <header class="text-center max-w-xl mb-8">
    <h1 class="text-3xl font-extrabold text-emerald-700">♻️ Trash to Treasure</h1>
    <p class="text-slate-600 mt-2">Identify disposal bins and find creative upcycling ideas instantly.</p>
  </header>

  <main class="w-full max-w-md bg-white p-6 rounded-2xl shadow-lg border border-slate-100">
    <form id="trashForm" class="space-y-4" onsubmit="event.preventDefault(); submitItem();">
      <div>
        <label for="descInput" class="block text-sm font-semibold text-slate-700 mb-1">Describe Item</label>
        <input type="text" id="descInput" placeholder="e.g., Greasy cardboard pizza box" 
               class="w-full border border-slate-300 rounded-lg p-3 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
      </div>

      <div>
        <label for="imageInput" class="block text-sm font-semibold text-slate-700 mb-1">Upload Image (Optional)</label>
        <input type="file" id="imageInput" accept="image/*" 
               class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100">
      </div>

      <button type="submit" id="submitBtn" 
              class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg transition-colors">
        Analyze Item
      </button>
    </form>

    <!-- Results Card -->
    <section id="resultCard" class="hidden mt-6 pt-6 border-t border-slate-100 space-y-4" aria-live="polite">
      <div>
        <span class="text-xs uppercase font-bold text-slate-400">Identified Item</span>
        <h2 id="itemName" class="text-xl font-bold text-slate-800"></h2>
      </div>

      <div>
        <span class="text-xs uppercase font-bold text-slate-400">Disposal Bin</span>
        <div id="binBadge" class="mt-1 inline-block px-3 py-1 text-sm font-semibold rounded-full text-white"></div>
      </div>

      <div>
        <h3 class="text-sm font-bold text-slate-700 mb-1">Preparation Steps:</h3>
        <ul id="prepSteps" class="list-disc list-inside text-sm text-slate-600 space-y-1"></ul>
      </div>

      <div>
        <h3 class="text-sm font-bold text-slate-700 mb-1">Upcycling Tip:</h3>
        <p id="upcyclingTip" class="text-sm text-slate-600 italic bg-emerald-50 p-3 rounded-lg border border-emerald-100"></p>
      </div>
    </section>
  </main>

  <script>
    async function submitItem() {
      const desc = document.getElementById('descInput').value;
      const fileInput = document.getElementById('imageInput');
      const btn = document.getElementById('submitBtn');
      const resultCard = document.getElementById('resultCard');

      if (!desc && !fileInput.files[0]) {
        alert('Please enter a description or select an image.');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Analyzing...';

      const formData = new FormData();
      if (desc) formData.append('description', desc);
      if (fileInput.files[0]) formData.append('image', fileInput.files[0]);

      try {
        const res = await fetch('/api/analyze-trash', { method: 'POST', body: formData });
        const data = await res.json();

        if (res.ok) {
          document.getElementById('itemName').innerText = data.item_name;

          const badge = document.getElementById('binBadge');
          badge.innerText = data.bin_category;
          badge.className = `mt-1 inline-block px-3 py-1 text-sm font-semibold rounded-full text-white ${
            data.bin_category === 'Recycle' ? 'bg-green-600' :
            data.bin_category === 'Compost' ? 'bg-amber-600' :
            data.bin_category === 'E-Waste' ? 'bg-purple-600' : 'bg-slate-600'
          }`;

          const prepList = document.getElementById('prepSteps');
          prepList.innerHTML = '';
          data.preparation_steps.forEach(step => {
            const li = document.createElement('li');
            li.innerText = step;
            prepList.appendChild(li);
          });

          document.getElementById('upcyclingTip').innerText = data.upcycling_tip;
          resultCard.classList.remove('hidden');
        } else {
          alert(data.error || 'Could not analyze item.');
        }
      } catch (err) {
        alert('Error connecting to backend server.');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Analyze Item';
      }
    }
  </script>
</body>
</html>
